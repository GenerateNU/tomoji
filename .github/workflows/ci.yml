name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.9

      - name: Install
        run: bun install --frozen-lockfile

      # Runs typecheck, lint, format:check and test. Deliberately the same
      # command engineers run locally, so CI and local can't drift.
      - name: Check
        run: bun run ci
