# Production deploy: Convex backend, then the Vercel frontend.
#
# Publishing a GitHub Release ships both together, built from the exact commit
# the tag points at. vercel.json's build command runs `convex deploy`, which
# pushes the backend first and only runs `next build` if that push succeeds, so
# the frontend never goes live against a backend that failed to deploy.
#
# Vercel's Git integration skips `main` (git.deploymentEnabled in vercel.json),
# so this workflow is the only path to production.
#
# Data migrations are NOT run here. Deploying code does not run them (see
# docs/MIGRATIONS.md); a TL runs them after the release.
name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or SHA to deploy (use an older tag to roll back)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Convex and frontend
    runs-on: ubuntu-latest
    environment:
      # Required reviewers on this environment pause every release for approval.
      # It also holds CONVEX_DEPLOY_KEY, so only an approved run can read it.
      name: production
      url: ${{ vars.PUBLIC_FRONTEND_URL }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the ref being deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # github.sha points at the workflow's own ref, not the one checked out,
      # so a manual deploy of an older tag would otherwise be mislabelled.
      - name: Resolve the deployed commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.9

      - name: Install
        run: bun install --frozen-lockfile

      # Pulls the Production-scoped variables (WorkOS etc.) and project
      # settings that `vercel build` needs.
      - name: Pull Vercel production settings
        run: bunx vercel@63.1.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Runs vercel.json's build command: Convex deploy, then next build.
      - name: Deploy Convex, then build the frontend
        run: bunx vercel@63.1.2 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Publish the frontend
        run: |
          set -euo pipefail
          bunx vercel@63.1.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta release="${{ github.event.release.tag_name || inputs.ref }}" \
            --meta commit="$DEPLOY_SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check the site answers
        env:
          PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS -o /dev/null "$PUBLIC_FRONTEND_URL"; then
              echo "up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${PUBLIC_FRONTEND_URL} did not answer after the deploy"
          exit 1

      - name: Summarize
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Ref: \`${{ github.event.release.tag_name || inputs.ref }}\` (\`${DEPLOY_SHA:0:7}\`)"
            echo "- Frontend: ${{ vars.PUBLIC_FRONTEND_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
